name: Deploy Development

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zabbix-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to development VM
    runs-on: ubuntu-latest

    environment:
      name: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan \
            -p "$DEPLOY_PORT" \
            -H "$DEPLOY_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'echo "SSH connection successful"; whoami; hostname'

      - name: Deploy application
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'

            set -euo pipefail

            PROJECT_DIR="/opt/zabbix-module-devkit"

            echo "Deploy host:"
            hostname

            echo "Deploy user:"
            whoami

            if [[ ! -d "$PROJECT_DIR/.git" ]]; then
              echo "ERROR: Repository not found at $PROJECT_DIR"
              exit 1
            fi

            cd "$PROJECT_DIR"

            git fetch origin main
            git checkout main
            git reset --hard origin/main

            PROJECT_DIR="/opt/zabbix-module-devkit"
            COMPOSE_FILE="$PROJECT_DIR/docker/compose.yml"

            echo "Project directory: $PROJECT_DIR"
            echo "Compose file: $COMPOSE_FILE"

            if [[ ! -d "$PROJECT_DIR/.git" ]]; then
            echo "ERROR: Git repository not found: $PROJECT_DIR"
            exit 1
            fi

            if [[ ! -f "$COMPOSE_FILE" ]]; then
            echo "ERROR: Docker Compose file not found: $COMPOSE_FILE"
            exit 1
            fi

            cd "$PROJECT_DIR"

            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo "Current revision:"
            git log -1 --oneline

            echo "Validating Docker Compose..."
            docker compose -f "$COMPOSE_FILE" config >/dev/null

            echo "Pulling containers..."
            docker compose -f "$COMPOSE_FILE" pull

            echo "Starting Zabbix development environment..."
            docker compose -f "$COMPOSE_FILE" up -d

            echo "Container status:"
            docker compose -f "$COMPOSE_FILE" ps

          EOF