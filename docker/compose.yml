services:
  postgres:
    image: postgres:17-alpine
    container_name: zabbix-dev-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zabbix_dev_password}
      ZBX_MONITOR_USER: ${ZBX_MONITOR_USER:-zbx_monitor}
      ZBX_MONITOR_PASSWORD: ${ZBX_MONITOR_PASSWORD:-zbx_monitor_dev_password}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-zabbix} -d ${POSTGRES_DB:-zabbix}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - zabbix-dev

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.4-latest
    container_name: zabbix-dev-server
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zabbix_dev_password}

    ports:
      - "10051:10051"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "zabbix_server -R config_cache_reload >/dev/null 2>&1 || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - zabbix-dev

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4-latest
    container_name: zabbix-dev-web
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_healthy

    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zabbix_dev_password}

      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_NAME: Zabbix Module DevKit
      PHP_TZ: America/Sao_Paulo

    ports:
      - "8080:8080"

    volumes:
      - ../modules:/usr/share/zabbix/modules

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/ping >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - zabbix-dev

  zabbix-agent2:
    image: zabbix/zabbix-agent2:ubuntu-7.4-latest
    container_name: zabbix-dev-agent2
    restart: unless-stopped

    depends_on:
      zabbix-server:
        condition: service_started

    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: ${ZBX_HOSTNAME:-DevKit-Stack}

    ports:
      - "10050:10050"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

    networks:
      - zabbix-dev

volumes:
  postgres_data:

networks:
  zabbix-dev:
    name: zabbix-module-devkit
