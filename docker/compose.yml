# Zabbix Module DevKit - local development stack.
#
# Structure follows the official zabbix/zabbix-docker compose files (branch 7.4):
#   * the Zabbix server has NO healthcheck. On a fresh volume it imports the
#     whole Zabbix schema before it starts serving, and no readiness probe can
#     wait that out reliably. Dependants use `service_started`.
#   * every other healthcheck declares `start_period`, so first-boot latency
#     does not consume the retry budget and mark a container unhealthy.
#   * the frontend probe matches the image built-in (`curl -f /ping`).
#
# Usage:
#   cp .env.example .env          # optional, the defaults below are dev-safe
#   docker compose up -d
#   docker compose logs -f zabbix-server
#
# Requires Docker Engine 25+ (healthcheck `start_interval`).

name: zabbix-module-devkit

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    container_name: zabbix-dev-postgres
    restart: unless-stopped
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb
    stop_grace_period: 1m

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zabbix_dev_password}
      ZBX_MONITOR_USER: ${ZBX_MONITOR_USER:-zbx_monitor}
      ZBX_MONITOR_PASSWORD: ${ZBX_MONITOR_PASSWORD:-zbx_monitor_dev_password}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro

    # `-h 127.0.0.1` forces a TCP probe. Without it pg_isready answers over the
    # unix socket of the *temporary* server the entrypoint runs while the
    # /docker-entrypoint-initdb.d scripts execute, so the container would report
    # healthy before it accepts network connections and zabbix-server would
    # start against a database that is not listening yet.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-zabbix} -d ${POSTGRES_DB:-zabbix} || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 1G

    networks:
      - zabbix-dev

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.4-latest
    container_name: zabbix-dev-server
    restart: unless-stopped
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    tmpfs: /tmp

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zabbix_dev_password}

    ports:
      - "${ZBX_SERVER_PORT:-10051}:10051"

    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000

    # No healthcheck on purpose. Adding one is what breaks this stack: on a
    # fresh volume the server spends minutes importing the schema, any probe
    # exhausts its retries, the container flips to `unhealthy`, and every
    # dependant waiting on `service_healthy` fails to start.

    deploy:
      resources:
        limits:
          memory: 1G

    networks:
      - zabbix-dev

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4-latest
    container_name: zabbix-dev-web
    restart: unless-stopped
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    tmpfs: /tmp

    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_started

    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zabbix_dev_password}

      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      ZBX_SERVER_NAME: ${ZBX_SERVER_NAME:-Zabbix Module DevKit}
      PHP_TZ: ${PHP_TZ:-America/Sao_Paulo}

    ports:
      - "${ZBX_WEB_PORT:-8080}:8080"

    # Frontend module path confirmed against zabbix-docker 7.4
    # (compose_zabbix_components.yaml): /usr/share/zabbix/modules.
    volumes:
      - ../modules:/usr/share/zabbix/modules:ro

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 5s

    deploy:
      resources:
        limits:
          memory: 512M

    networks:
      - zabbix-dev

  zabbix-agent2:
    image: zabbix/zabbix-agent2:ubuntu-7.4-latest
    container_name: zabbix-dev-agent2
    restart: unless-stopped
    init: true
    logging: *default-logging
    stop_grace_period: 5s

    depends_on:
      zabbix-server:
        condition: service_started

    # `privileged` + `pid: host` mirror the official agent2 service.
    # Without them the agent runs as uid 1997 (zabbix) and cannot read
    # /var/run/docker.sock (root:docker, mode 0660), so every docker.* item
    # fails with "permission denied"; host CPU and process metrics would also
    # be scoped to the container's own PID namespace.
    #
    # Narrower alternative when host process metrics are not needed: drop both
    # lines and use `group_add: ["<host docker GID>"]` instead.
    privileged: true
    pid: host

    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      ZBX_HOSTNAME: ${ZBX_HOSTNAME:-DevKit-Stack}

    # Loopback-only: the server reaches the agent over the compose network by
    # service name, this host port is for manual zabbix_get debugging.
    ports:
      - "127.0.0.1:${ZBX_AGENT_PORT:-10050}:10050"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro

    deploy:
      resources:
        limits:
          memory: 256M

    networks:
      - zabbix-dev

volumes:
  postgres_data:

networks:
  zabbix-dev:
    name: zabbix-module-devkit
